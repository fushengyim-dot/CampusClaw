schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  CampusClaw serves teachers and students of the software development course.
  Current stage is lesson 02: specification documents only, no business code.
  Planned first-round stack is React/TypeScript, Go, MySQL, Nginx and Docker Compose.
  Current change covers login, teacher/student authorization, class isolation and text-material ingestion.
  Follow README.md and AGENTS.md. All implementation tasks stay unchecked until lesson 03.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
